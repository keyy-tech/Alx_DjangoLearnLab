<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
</head>
<body>
    <h1>All Posts</h1>

    <p><a href="{% url 'post_create' %}">Create New Post</a></p>

    {% if posts %}
    <ul>
        {% for post in posts %}
        <li>
            <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
            <p>By {{ post.author.username }} on {{ post.published_date }}</p>
            <p>{{ post.content|truncatechars:160 }}</p>
            <p>
                <a href="{% url 'post_update' post.pk %}">Edit</a> |
                <a href="{% url 'post_delete' post.pk %}">Delete</a>
            </p>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No posts yet.</p>
    {% endif %}

    <p><a href="/static">Home</a></p>
</body>
</html>
