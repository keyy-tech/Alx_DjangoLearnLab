<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
</head>
<body>
    <p><a href="{% url 'home' %}">Back to Posts</a></p>
    <h1>{{ post.title }}</h1>
    <p>By {{ post.author.username }} on {{ post.published_date }}</p>
    <div>
        <p>{{ post.content }}</p>
    </div>
    <p>
        <a href="{% url 'post_update' post.pk %}">Edit</a> |
        <a href="{% url 'post_delete' post.pk %}">Delete</a>
    </p>
</body>
</html>
